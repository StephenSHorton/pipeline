name: Pipeline Release

# git tag v0.0.14 && git push origin v0.0.14
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.0.14)"
        required: true

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-15 # Apple Silicon
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: desktop/go.mod
          cache-dependency-path: desktop/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Resolve version
        id: ver
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Test
        working-directory: desktop
        run: go test ./internal/... .

      - name: Build Pipeline.app and DMG
        working-directory: desktop
        run: build/darwin/package.sh "${{ steps.ver.outputs.version }}"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-${{ steps.ver.outputs.version }}-darwin-arm64
          path: |
            desktop/bin/pipeline-*-darwin-*.dmg
            desktop/bin/SHA256SUMS

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Pipeline ${{ steps.ver.outputs.tag }}
          generate_release_notes: true
          files: |
            desktop/bin/pipeline-*-darwin-*.dmg
            desktop/bin/SHA256SUMS
