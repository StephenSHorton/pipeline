<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="refresh" content="0;url=../?asset=ironclad-vanguard" />
  <title>Redirecting to factory inspector</title>
  <script>
    const params = new URLSearchParams(location.search);
    const asset = params.get("asset") || "ironclad-vanguard";
    location.replace(`../?asset=${encodeURIComponent(asset)}`);
  </script>
</head>
<body>
  <p>Sprite stack lives in the factory inspector. <a id="go" href="../">Open viewer</a>.</p>
  <script>
    document.getElementById("go").href = `../?asset=${encodeURIComponent(new URLSearchParams(location.search).get("asset") || "ironclad-vanguard")}`;
  </script>
</body>
</html>
